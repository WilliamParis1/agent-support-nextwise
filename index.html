<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeeadf">
  <meta name="description" content="Mr Camembert : le point quotidien du club sur les marchés et les actifs de la compétition Nextwise.">
  <title>Synapse Capital — Mr Camembert</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <script src="character.js" defer></script>
</head>
<body>
  <header class="header">
    <a href="./" aria-label="Synapse Capital, accueil"><img class="logo" src="assets/synapse-capital.svg" width="142" height="71" alt="Synapse Capital"></a>

  </header>
  <div class="workspace-layout">
  <main class="home">
    <section class="daily-section" id="daily-content" aria-labelledby="daily-heading">
      <h1 id="daily-heading" class="sr-only">Les points de marché du jour et de la veille</h1>
      <div class="edition-grid">
        <article class="edition today" id="today-edition" aria-labelledby="today-heading">
          <div class="edition-header"><h2 id="today-heading">Aujourd’hui</h2></div>
          <p class="report-date" data-date></p><p class="edition-status" data-status role="status">Chargement du point…</p>
          <p class="report-text" data-text hidden></p>
          <div class="brief-actions" data-actions><a class="primary-button" data-pdf aria-label="Télécharger le PDF" aria-disabled="true">PDF ↓</a><button class="copy-button" data-copy type="button" disabled aria-label="Copier le texte" title="Copier le texte">Copier</button><a class="text-link" data-evidence download hidden>Sources</a></div>
          <span class="sr-only" id="daily-analysis" data-analysis-status></span>
        </article>
        <article class="edition" id="previous-edition" aria-labelledby="previous-heading">
          <div class="edition-header"><h2 id="previous-heading">La veille</h2></div>
          <p class="report-date" data-date></p><p class="edition-status" data-status role="status">Chargement du point…</p>
          <p class="report-text" data-text hidden></p>
          <div class="brief-actions" data-actions><a class="primary-button" data-pdf aria-label="Télécharger le PDF" aria-disabled="true">PDF ↓</a><button class="copy-button" data-copy type="button" disabled aria-label="Copier le texte" title="Copier le texte">Copier</button><a class="text-link" data-evidence download hidden>Sources</a></div>
          <span class="sr-only" data-analysis-status></span>
        </article>
      </div>
    </section>
    <section class="conversation-section" id="conversation" aria-label="Mr Camembert"><div class="conversation-panel">

    <div class="professor-scene" id="professor-scene" data-state="awake">
      <div class="speech-bubble"><p id="professor-speech" role="status" aria-live="polite" aria-atomic="true">Bonjour ! Moi, c’est Mr Camembert.</p><span class="speech-cursor" aria-hidden="true"></span></div>
      <div class="room-window" aria-hidden="true"><span></span></div>
      <div class="room-lamp" aria-hidden="true"></div>
      <div class="room-books" aria-hidden="true"></div>
      <div class="room-plant" aria-hidden="true"></div>
      <div class="professor-floor" aria-hidden="true"></div>
      <img id="professor" class="professor" src="assets/professor.png" width="320" height="320" alt="Mr Camembert, personnage en pixel art avec des lunettes, une moustache et une baguette de professeur.">
      <div id="professor-pose" class="professor-pose" role="img" aria-label="Mr Camembert" hidden></div>
    </div>
    <div class="character-actions"><button id="character-toggle" type="button" disabled>Bonne nuit</button></div>
    </div></section>
  </main>
  </div>
</body>
</html>
