name: Publier un rapport ChatGPT
on:
  push:
    branches: [main]
    paths:
      - content/inbox/**
      - automation/ingest.py
      - automation/authored_pdf.py
      - .github/workflows/ingest-chatgpt.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mr-synapse-reports
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - run: pip install -r automation/requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Valider les fichiers et produire les PDF
        run: python -m automation.ingest
      - name: Versionner les rapports générés
        run: |
          git add reports/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publier les rapports reçus de ChatGPT'
            git pull --rebase origin main
            git push
          fi
